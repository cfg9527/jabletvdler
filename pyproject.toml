[project]
name = "jabletv-downloader"
version = "0.1.0"
description = "JableTV video downloader with Textual TUI"
requires-python = ">=3.9"
dependencies = [
    "textual>=0.70.0",
    "httpx>=0.28.0",
    "m3u8>=5.0.0",
    "cryptography>=42.0.0",
    "pyfiglet>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "textual-dev>=1.2.0",
]
scraper = [
    "curl_cffi>=0.7.0",
]

[project.scripts]
jabletv = "jabletv.app:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jabletv*"]
